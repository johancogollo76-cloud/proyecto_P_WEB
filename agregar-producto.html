<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agregar Producto - Motoworks</title>
  <link rel="stylesheet" href="agregar-producto.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar">
      <div class="brand"><span class="brand-badge">MW</span><div><h2>MOTOWORKS</h2><small>GARAGE + PARTS</small></div></div>
      <nav class="nav-menu">
        <a href="dashboard.html" class="nav-item"><i data-lucide="layout-dashboard"></i> Inicio</a>
        <a href="inventario.html" class="nav-item active"><i data-lucide="package"></i> Inventario</a>
        <a href="ventas.html" class="nav-item"><i data-lucide="shopping-cart"></i> Ventas</a>
        <a href="#" class="nav-item"><i data-lucide="receipt"></i> Gastos</a>
        <a href="usuarios.html" class="nav-item"><i data-lucide="users"></i> Usuarios</a>
        <a href="#" class="nav-item"><i data-lucide="settings"></i> Configuración</a>
      </nav>
      <div class="user-profile"><div class="avatar">CM</div><div><strong>Carlos Méndez</strong><small>Administrador</small></div></div>
    </aside>

    <main class="main-content">
      <div class="breadcrumb">INVENTARIO / PRODUCTOS</div>
      <header class="page-header">
        <h1>Agregar producto</h1>
        <!-- Enlace simulado para ver cómo luce con errores -->
        <a href="producto-errores.html" class="link">Ver estado con errores de validación</a>
      </header>

      <form class="product-form-layout">
        <div class="upload-box">
          <i data-lucide="upload-cloud"></i>
          <span>Subir imagen</span>
        </div>

        <div class="form-fields-grid">
          <div class="form-group"><label>Nombre del producto</label><input type="text" class="form-control" placeholder="Ingresar información" /></div>
          <div class="form-group"><label>SKU / Código</label><input type="text" class="form-control" placeholder="Ingresar información" /></div>
          <div class="form-group"><label>Marca</label><input type="text" class="form-control" placeholder="Ingresar información" /></div>
          <div class="form-group"><label>Modelo compatible</label><input type="text" class="form-control" placeholder="Ingresar información" /></div>
          <div class="form-group">
            <label>Categoría</label>
            <select class="form-control"><option>Seleccionar categoría</option></select>
          </div>
          <div class="form-group"><label>Precio de compra</label><input type="number" class="form-control" placeholder="Ingresar información" /></div>
          <div class="form-group"><label>Precio de venta</label><input type="number" class="form-control" placeholder="Ingresar información" /></div>
          <div class="form-group"><label>Cantidad inicial</label><input type="number" class="form-control" placeholder="Ingresar información" /></div>
          <div class="form-group"><label>Stock mínimo</label><input type="number" class="form-control" placeholder="Ingresar información" /></div>
          <div class="form-group"><label>Proveedor</label><input type="text" class="form-control" placeholder="Ingresar información" /></div>
          <div class="form-group full-width"><label>Descripción</label><textarea class="form-control" rows="3" placeholder="Describe el producto"></textarea></div>
        </div>

        <div class="form-actions full-width">
          <a href="inventario.html" class="btn btn-secondary">Cancelar</a>
          <a href="inventario.html" class="btn btn-primary">Guardar producto</a>
        </div>
      </form>
    </main>
  </div>
  <script>lucide.createIcons();</script>
</body>
</html>
