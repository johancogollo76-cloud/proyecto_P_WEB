<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Marcas · MotoWorks</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,600;0,700;0,800;0,900;1,900&display=swap">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/vistas.css">
  <!-- Orden de carga: utilidades → MODELO → VISTA → CONTROLADOR -->
  <script src="js/utilidades.js" defer></script>
  <script src="js/modelo/almacenamiento.js" defer></script>
  <script src="js/modelo/datos.js" defer></script>
  <script src="js/vista/comun.js" defer></script>
  <script src="js/vista/catalogo.js" defer></script>
  <script src="js/controlador/catalogo.js" defer></script>
</head>
<body data-seccion="marcas" data-tabla="marcas" data-campo="marca" data-articulo="una marca">

<!-- El menú lateral y la barra del celular los dibuja js/comun.js -->
<div class="app">
  <main class="contenido">

    <section class="vista">
      <div class="encabezado">
        <div><h1>Marcas</h1><p class="migas">Inicio / Marcas</p></div>
        <button class="btn btn-primario" type="button" id="nuevo-item"><svg class="ico"><use href="#plus"></use></svg>Nueva marca</button>
      </div>

      <p class="aviso-ok" id="aviso-catalogo" hidden><svg class="ico"><use href="#circle-check"></use></svg><span></span></p>
      <p class="resumen-errores" id="aviso-error" hidden><svg class="ico"><use href="#triangle-alert"></use></svg><span></span></p>

      <div class="filtros">
        <label class="buscador"><svg class="ico"><use href="#search"></use></svg><input type="search" id="buscar-catalogo" placeholder="Buscar marca"></label>
      </div>

      <div class="lista-usuarios" id="lista-catalogo"></div>
    </section>

  </main>
</div>
<dialog id="dlg-catalogo" data-nuevo="Nueva marca" data-editar="Editar marca">
  <form class="dialogo-cuerpo" id="form-catalogo" novalidate>
    <h2 id="titulo-dialogo">Nueva marca</h2>
    <div class="resumen-errores" hidden><svg class="ico"><use href="#triangle-alert"></use></svg><span></span></div>

    <div class="campo">
      <label for="cat-nombre">Nombre</label>
      <input id="cat-nombre" required minlength="2" placeholder="Ej. Yamaha">
    </div>
    <div class="campo">
      <label for="cat-extra">País de origen (opcional)</label>
      <input id="cat-extra" placeholder="Ej. Japón">
    </div>

    <div class="dialogo-acciones">
      <button class="btn" type="button" data-cerrar>Cancelar</button>
      <button class="btn btn-primario" type="submit">Guardar</button>
    </div>
  </form>
</dialog>

<dialog id="dlg-eliminar" class="peligro">
  <div class="dialogo-cuerpo">
    <span class="icono-peligro"><svg class="ico"><use href="#trash-2"></use></svg></span>
    <div>
      <h2>¿Eliminar esta marca?</h2>
      <p id="nombre-eliminar"></p>
      <p class="advertencia">Esta acción no se puede deshacer.</p>
    </div>
    <div class="dialogo-acciones">
      <button class="btn" type="button" data-cerrar>Cancelar</button>
      <button class="btn btn-peligro" type="button" id="confirmar-eliminar"><svg class="ico"><use href="#trash-2"></use></svg>Eliminar</button>
    </div>
  </div>
</dialog>
